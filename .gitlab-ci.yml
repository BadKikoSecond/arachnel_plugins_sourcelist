# Plugin packages land here via ingest (triggered from plugin release CI).
# Local *.arach changes still run verify + regenerate index.
#
# Job token: Settings → CI/CD → Job token permissions
# - allow inbound from arachnel-plugin-steamidra / arachnel-plugin-freetp
# - allow Git push requests to this repository (CI_JOB_TOKEN)

stages:
  - ingest
  - verify
  - index

variables:
  ARACHNEL_VERSION: "0.1.34a"
  QT_VERSION: "6.11.1"

workflow:
  rules:
    # Ingest triggers must win even when HEAD commit is a previous ingest push.
    - if: '$INGEST_DOWNLOAD_URL'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    # Avoid loops when ingest / index commits back to main.
    - if: '$CI_COMMIT_MESSAGE =~ /^ci: ingest /'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^ci: regenerate plugins\.json/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Triggered by plugin release pipelines (no cross-repo push token needed).
ingest-plugin:
  stage: ingest
  image: python:3.12-slim
  tags:
    - linux
  timeout: 15m
  rules:
    - if: '$INGEST_DOWNLOAD_URL'
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates git
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "Arachnel Plugin CI"
  script:
    - |
      set -euo pipefail
      NAME="${INGEST_ARACH_NAME:-plugin.arach}"
      NAME="$(basename "${NAME}")"
      echo "Downloading ${NAME} from ${INGEST_DOWNLOAD_URL}"
      curl --fail --location --retry 3 --retry-delay 2 \
        --output "${NAME}" \
        "${INGEST_DOWNLOAD_URL}"
      test -s "${NAME}"
      ARGS=(
        --arach "${NAME}"
        --url "${INGEST_DOWNLOAD_URL}"
        --min-arachnel "${INGEST_MIN_ARACHNEL:-0.1.34}"
        --abi-token "${INGEST_ABI_TOKEN:-develop}"
      )
      # Empty max clears upper bound in ingest_plugin_build.py
      ARGS+=(--max-arachnel "${INGEST_MAX_ARACHNEL:-}")
      python3 tools/ingest_plugin_build.py "${ARGS[@]}"
      if git diff --quiet -- plugins.json; then
        echo "plugins.json unchanged"
        exit 0
      fi
      git add plugins.json
      git commit -m "ci: ingest ${NAME} ${INGEST_TAG:-build} into plugins.json"
      # Concurrent plugin releases may race on main - rebase and retry push.
      REMOTE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      for attempt in 1 2 3 4 5; do
        git fetch "${REMOTE}" "${CI_DEFAULT_BRANCH}"
        if git rebase "FETCH_HEAD"; then
          if git push "${REMOTE}" "HEAD:${CI_DEFAULT_BRANCH}"; then
            echo "Published ${NAME} to sourcelist"
            exit 0
          fi
        fi
        echo "push/rebase conflict (attempt ${attempt}), retrying..."
        git rebase --abort 2>/dev/null || true
        sleep $((attempt * 2))
      done
      echo "failed to push after retries" >&2
      exit 1

.verify-rules:
  rules:
    - if: '$INGEST_DOWNLOAD_URL'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^ci: regenerate plugins\.json/'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^ci: ingest /'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - "*.arach"
        - tools/**/*
        - .gitlab-ci.yml

verify:linux:
  extends: .verify-rules
  stage: verify
  image: ubuntu:24.04
  tags:
    - linux
  timeout: 45m
  script:
    - bash tools/ci/verify-linux.sh

verify:windows:
  extends: .verify-rules
  stage: verify
  tags:
    - windows
  timeout: 45m
  allow_failure: true
  script:
    - pwsh -NoProfile -ExecutionPolicy Bypass -File tools/ci/verify-windows.ps1

generate-index:
  stage: index
  image: python:3.12-alpine
  tags:
    - linux
  needs:
    - job: verify:linux
      optional: true
    - job: verify:windows
      optional: true
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "Arachnel CI"
  script:
    - python3 tools/generate_plugins_index.py
    - |
      set -e
      if git diff --quiet -- plugins.json; then
        echo "plugins.json unchanged"
        exit 0
      fi
      echo "plugins.json changed:"
      git --no-pager diff -- plugins.json || true
      git add plugins.json
      git commit -m "ci: regenerate plugins.json from .arach packages"
      git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
      echo "Pushed updated plugins.json"
  rules:
    - if: '$INGEST_DOWNLOAD_URL'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^ci: regenerate plugins\.json/'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^ci: ingest /'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - "*.arach"
        - tools/generate_plugins_index.py
        - tools/ingest_plugin_build.py
        - .gitlab-ci.yml
